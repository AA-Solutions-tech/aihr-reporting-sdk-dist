name: aihr_reporting_sdk
description: >
  Flutter widget for the NizamyAI reporting assistant. It renders the hosted
  reporting chat page in a WebView and hands the host app's access token and
  language to it. Built for the Nizamy app; not a generic package.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
